<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>French Family Travels Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: an app shell — sticky top bar, a "shelf" home of trip covers grouped by the three printed volumes,
   and a trip screen with Story / Photos / Book tabs. Palette and type follow the printed Blurb volumes. */
:root{
  --paper:#F6F2EA; --surface:#FFFDF8; --ink:#1D2733; --muted:#5E6570; --line:#E3DCCD;
  --gold:#8A5F1E; --navy:#1B2A41; --navy-ink:#F3EEE6; --scrim:rgba(14,20,32,.92); --chip:#EFE7D8;
  --display:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11161F; --surface:#18202C; --ink:#EDE7DC; --muted:#A7ADB6; --line:#2A3443;
  --gold:#D9B36A; --navy:#0B1220; --navy-ink:#F3EEE6; --scrim:rgba(6,9,14,.95); --chip:#232D3B; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#11161F; --surface:#18202C; --ink:#EDE7DC; --muted:#A7ADB6; --line:#2A3443;
  --gold:#D9B36A; --navy:#0B1220; --navy-ink:#F3EEE6; --scrim:rgba(6,9,14,.95); --chip:#232D3B; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:21px;letter-spacing:.2px;white-space:nowrap}
.brand svg{flex:none}
.bar .sp{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:0 12px;height:36px;min-width:0;flex:0 1 300px}
.searchbox input{background:none;border:0;color:inherit;font:inherit;outline:none;width:100%;min-width:0}
.searchbox input::placeholder{color:rgba(243,238,230,.65)}
.iconbtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.1)}

/* home */
.hero{background:var(--navy);color:var(--navy-ink);padding-block:28px 34px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;color:rgba(243,238,230,.78);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:20px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-weight:400;font-size:28px;color:#E2C27D}
.stats span{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(243,238,230,.7)}
.strip{display:flex;gap:6px;margin-top:24px;overflow:hidden;height:92px;border-radius:10px}
.strip img{height:92px;width:auto;flex:none;object-fit:cover;border-radius:6px;opacity:.95}
.shelf{padding-block:30px 6px;display:flex;flex-direction:column;gap:14px}
.shelf h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.shelfhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.readvol{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:500;font-size:14px}
.readvol:hover{opacity:.9}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .18s ease, box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,28,40,.14)}
.cover{aspect-ratio:4/3;max-width:100%;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:var(--chip)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;background:var(--chip)}
.cover img:first-child{grid-row:1/3}
.card .meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card h3{font-family:var(--display);font-weight:400;font-size:23px;margin:2px 0 0;line-height:1.15}
.card .dates{color:var(--muted);font-size:13.5px}
.card .count{margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card.ext .cover{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#2B4060);color:#E2C27D;font-family:var(--display);font-size:30px;text-align:center;padding:20px}
.foot{padding-block:36px 48px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}

/* trip */
.trip-hero{position:relative;background:var(--navy);color:var(--navy-ink);overflow:hidden}
.trip-hero .bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);opacity:.42}
.trip-hero .bg img{width:100%;height:100%;object-fit:cover}
.trip-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,20,32,.25) 0%,rgba(14,20,32,.88) 100%)}
.trip-hero .wrap{position:relative;padding-block:26px 24px;display:flex;flex-direction:column;gap:8px;min-height:250px;justify-content:flex-end}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(255,255,255,.12);margin-bottom:auto}
.trip-hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,64px);line-height:1;margin:4px 0 0;text-wrap:balance}
.trip-hero .eyebrow{color:#E2C27D}
.trip-hero .sub{color:rgba(243,238,230,.82);max-width:70ch}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,58px));z-index:15;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;align-items:center;height:50px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:999px;font-weight:500;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs .sp{flex:1}
.tabs a.ext{font-size:13.5px;color:var(--gold);text-decoration:none;white-space:nowrap;padding:8px 6px}
.load{padding-block:40px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.prog{width:min(360px,100%);height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}

/* story */
.toc{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px}
.toc button{flex:none;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px;white-space:nowrap}
.sec{padding-block:30px 8px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:130px}
.sec h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.sec .sub{font-style:italic;color:var(--muted);margin:0}
.sec .intro{max-width:72ch;margin:0;color:var(--ink);white-space:pre-line}
.rule{width:44px;height:3px;background:var(--gold)}
.mosaic{display:flex;flex-wrap:wrap;gap:10px}
.mosaic::after{content:"";flex-grow:1000}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp .ims{display:flex;gap:4px}
.ph{display:block;padding:0;border-radius:6px;overflow:hidden;background:var(--chip);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:12.5px;line-height:1.38;color:var(--muted);min-width:0}
.cap b{color:var(--ink);font-weight:700}
.closing{padding-block:40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.closing h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.closing .ph{width:min(560px,100%);aspect-ratio:3/2;max-width:100%}

/* photos */
.allph{display:flex;flex-wrap:wrap;gap:5px;padding-block:18px 30px}
.allph::after{content:"";flex-grow:1000}

/* book */
.book{padding-block:18px 30px;display:flex;flex-direction:column;gap:14px;align-items:center}
.page{width:100%;max-width:1000px;aspect-ratio:1325/1125;max-height:calc(100vh - 230px);background:var(--surface);border-radius:4px;box-shadow:0 8px 30px rgba(20,28,40,.18);display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.page img{width:100%;height:100%;object-fit:contain;display:block}
.pager{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.pbtn{width:44px;height:44px;border-radius:999px;background:var(--chip);display:grid;place-items:center}
.pbtn:disabled{opacity:.35;cursor:default}
.thumbs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px 2px 10px}
.thumbs button{flex:none;width:76px;aspect-ratio:1325/1125;border-radius:3px;overflow:hidden;opacity:.6;border:2px solid transparent;padding:0;background:var(--chip)}
.thumbs button[aria-current="true"]{opacity:1;border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:var(--scrim);color:#F3EEE6;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb .top{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:rgba(243,238,230,.75);font-variant-numeric:tabular-nums}
.lb .top .sp{flex:1}
.lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.lb .nav.l{left:max(10px,env(safe-area-inset-left,0px))} .lb .nav.r{right:max(10px,env(safe-area-inset-right,0px))}
.lb .capbox{padding:12px 18px 18px;max-width:900px;margin:0 auto;text-align:center;font-size:14px;line-height:1.45;color:rgba(243,238,230,.85);min-height:56px}
.lb .capbox b{color:#fff}
.lb .where{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#E2C27D;margin-bottom:4px}

/* search */
.results{display:flex;flex-direction:column;gap:10px;padding-block:20px 40px}
.res{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.res .t{width:84px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:var(--chip)}
.res .t img{width:100%;height:100%;object-fit:cover}
.res .x{min-width:0;display:flex;flex-direction:column;gap:2px}
.res .x b{font-weight:700}
.res .x span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:rgba(217,179,106,.45);color:inherit;border-radius:3px}
.mainnav{display:flex;gap:2px;margin-left:10px}
.mainnav button{padding:7px 12px;border-radius:999px;font-weight:500;font-size:14px;color:rgba(243,238,230,.75)}
.mainnav button[aria-current="true"]{background:rgba(226,194,125,.18);color:#F3EEE6}

/* globe: a deliberate night view in both themes */
.globe{--g-bg:#060C17;--g-ink:#EEE6D8;--g-mut:#9AA6B7;--g-line:rgba(238,230,216,.12);--v1:#E2C27D;--v2:#6EC6B9;--v3:#F2967A;
  position:relative;background:radial-gradient(120% 90% at 40% 45%,#13213A 0%,#0A1426 45%,var(--g-bg) 100%);color:var(--g-ink);display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 58px - env(safe-area-inset-top,0px));min-height:520px;overflow:hidden}
.globe canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.globe canvas:active{cursor:grabbing}
.gstage{position:relative;min-width:0}
.gtitle{position:absolute;left:max(22px,env(safe-area-inset-left,0px));top:20px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.gtitle h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.5vw,50px);margin:0;line-height:1}
.gtitle .eyebrow{color:#E2C27D}
.gtitle p{margin:0;color:var(--g-mut);font-size:13.5px;font-variant-numeric:tabular-nums}
.glegend{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:18px;display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--g-mut)}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.gctl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.gctl button{width:38px;height:38px;border-radius:999px;background:rgba(238,230,216,.1);color:var(--g-ink);font-size:18px;display:grid;place-items:center} #gcity{font-size:13px;font-weight:700;letter-spacing:.5px} #gcity[aria-pressed="true"]{background:#E2C27D;color:#0A1426}
.gtip{position:absolute;pointer-events:none;background:rgba(6,12,23,.92);border:1px solid var(--g-line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;max-width:240px;transform:translate(-50%,calc(-100% - 14px));white-space:normal}
.gtip b{display:block;font-size:13.5px}
.gpanel{border-left:1px solid var(--g-line);background:rgba(6,12,23,.55);backdrop-filter:blur(8px);overflow-y:auto;padding:18px 18px 30px;display:flex;flex-direction:column;gap:14px;min-width:0}
.gpanel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
.gtrips{display:flex;flex-direction:column;gap:6px}
.gtrip{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid transparent}
.gtrip:hover{background:rgba(238,230,216,.06)}
.gtrip[aria-pressed="true"]{border-color:var(--g-line);background:rgba(238,230,216,.08)}
.gtrip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.gtrip .yr{font-variant-numeric:tabular-nums;color:var(--g-mut);font-size:12.5px;width:38px;flex:none}
.gtrip .nm{flex:1;min-width:0;font-weight:500}
.gtrip .ct{font-size:12px;color:var(--g-mut);font-variant-numeric:tabular-nums}
.gstops{display:flex;flex-direction:column;border-top:1px solid var(--g-line)}
.gstop{display:grid;grid-template-columns:22px 1fr;gap:10px;text-align:left;padding:10px 4px;border-bottom:1px solid var(--g-line)}
.gstop .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0A1426;font-variant-numeric:tabular-nums}
.gstop b{display:block}
.gstop span{display:block;color:var(--g-mut);font-size:12.5px}
.gstop .when{color:var(--g-ink);font-variant-numeric:tabular-nums;font-size:12.5px;margin-top:2px}
.gstop .src{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#E2C27D}
.gopen{align-self:flex-start;padding:9px 14px;border-radius:999px;background:#E2C27D;color:#0A1426;font-weight:700;font-size:13.5px}
.gback{align-self:flex-start;font-size:13px;color:var(--g-mut);padding:4px 0}
@media (max-width:860px){ .globe{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto} .gpanel{border-left:0;border-top:1px solid var(--g-line)} }

.gstage{position:relative;min-width:0;min-height:0;height:100%;overflow:hidden}
.globe canvas{position:absolute;inset:0;width:100%;height:100%}
.gsearch{position:absolute;top:20px;right:16px;width:min(260px,40%);z-index:3}
.gsearch input{width:100%;font:inherit;font-size:13.5px;padding:9px 12px;border-radius:999px;border:1px solid var(--g-line);background:rgba(6,12,23,.75);color:var(--g-ink)}
.gsearch input::placeholder{color:var(--g-mut)}
.gres{margin-top:6px;background:rgba(6,12,23,.95);border:1px solid var(--g-line);border-radius:12px;max-height:300px;overflow:auto}
.gres button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:8px 12px;border-bottom:1px solid var(--g-line)}
.gres button span{font-size:12px;color:var(--g-mut)}
.glegend button{display:inline-flex;align-items:center;font-size:12px;color:var(--g-mut);padding:4px 8px;border-radius:999px}
.glegend button[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.glegend button:hover{background:rgba(238,230,216,.08)}
.gcard{position:absolute;z-index:4;width:320px;max-width:calc(100% - 24px);background:rgba(8,14,26,.96);border:1px solid var(--g-line);border-radius:16px;padding:14px 14px 14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:6px;color:var(--g-ink)}
.gcard h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.05}
.gcard p{margin:0;font-size:13px;color:var(--g-mut)} .gcard .when{color:var(--g-ink);font-variant-numeric:tabular-nums} .gcard .when span{color:#E2C27D;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.gcard .gx{position:absolute;top:6px;right:8px;width:30px;height:30px;border-radius:999px;font-size:20px;color:var(--g-mut)} .gcard .gx:hover{background:rgba(238,230,216,.1)}
.gph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px} .gph .ph{aspect-ratio:1;border-radius:6px} .gph .ph img{width:100%;height:100%;object-fit:cover}
.gph .muted,.muted{color:var(--g-mut);font-size:12.5px;grid-column:1/-1}
.gnav{display:flex;justify-content:space-between;gap:6px;margin-top:4px} .gnav button{font-size:12.5px;color:var(--g-ink);padding:6px 8px;border-radius:8px;background:rgba(238,230,216,.07)} .gnav button:disabled{opacity:.3}
.gbtns{display:flex;flex-wrap:wrap;gap:8px} .gopen.ghost{background:transparent;border:1px solid var(--g-line);color:var(--g-ink)}
.ghelp{color:var(--g-mut);font-size:12.5px;margin:0;line-height:1.5}
.gctl{z-index:3} .gtitle{z-index:2} .glegend{z-index:2} .gcard[hidden],.gtip[hidden],.gres[hidden]{display:none!important}
.globe:fullscreen{height:100vh}
@media (max-width:860px){ .gsearch{top:auto;bottom:14px;left:16px;right:auto;width:min(260px,60%)} .glegend{bottom:64px} .gtitle h1{font-size:30px} }
.navback{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:#F3EEE6;flex:none}
.navback:hover{background:rgba(255,255,255,.1)} .navback[hidden]{display:none}
.kbd{position:fixed;inset:0;z-index:60;background:rgba(5,8,13,.6);display:grid;place-items:center;padding:16px}
.kbd>div{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px 24px;width:min(560px,100%);max-height:85vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.kbd h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 6px}
.kbd h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}

{ const si=$('.searchbox input'); if(si){ const mq=matchMedia('(max-width:640px)'); si.dataset.long=si.placeholder; const sp=()=>{ si.placeholder=mq.matches?(si.dataset.short||'Search'):si.dataset.long }; sp(); mq.addEventListener('change',sp) } }

/* packs: fetch a .bin once, slice images out as blob URLs */
async function loadPack(name,onp){
  if(packs[name]) return packs[name];
  packs[name]=(async()=>{const r=await fetch(name); if(!r.ok) throw new Error(name+' '+r.status);
    const total=+r.headers.get('content-length')||0; if(!r.body||!total||!onp) return await r.arrayBuffer();
    const rd=r.body.getReader(), chunks=[]; let got=0; for(;;){const {done,value}=await rd.read(); if(done)break; chunks.push(value); got+=value.length; onp(got,total)}

function sliceURL(key,files,ref){ const id=key+':'+ref.join(','); if(urls[id]) return urls[id];

async function ensurePhotos(t){ await Promise.all(t.photoPacks.map(f=>loadPack(f))); for(const f of t.photoPacks) packs[f]=await packs[f] }
async function ensureTrip(t,progressEl){
  const files=[...t.photoPacks,...(t.pagePacks||[])]; let done=0; const sizes={};
  await Promise.all(files.map(f=>loadPack(f,(g,tot)=>{sizes[f]=[g,tot]; if(progressEl){let a=0,b=0; for(const k in sizes){a+=sizes[k][0];b+=sizes[k][1]} progressEl.style.width=(b?100*a/b:0)+'%'}})));
  for(const f of files) packs[f]=await packs[f];
}
const purl=(t,id)=>{const r=t.photos[id]; return r?sliceURL(t.key,t.photoPacks,r):''};
/* thumbnails: small per-trip packs (th_*.bin) so cards, pins and grids never pull the full photo packs */
async function ensureThumbs(t){ if(!t.thumbPack) return ensurePhotos(t); packs[t.thumbPack]=await loadPack(t.thumbPack) }

function openLB(t,list,i){

   <div class="capbox" id="lbc"></div>`;
  const opener=document.activeElement; el.setAttribute('aria-modal','true'); document.body.appendChild(el); document.body.style.overflow='hidden'; const trap=e=>{ if(e.key!=='Tab') return; const f=[...el.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null); if(!f.length) return; const a=f[0], z=f[f.length-1]; if(e.shiftKey&&document.activeElement===a){ z.focus(); e.preventDefault() } else if(!e.shiftKey&&document.activeElement===z){ a.focus(); e.preventDefault() } }; el.addEventListener('keydown',trap); setTimeout(()=>el.querySelector('#lbx')?.focus(),0);
  const show=k=>{ i=(k+list.length)%list.length; const it=list[i]; const im=el.querySelector('#lbi'); const u=purl(t,it.id); if(u) im.src=u; else { im.src=turl(t,it.id); ensurePhotos(t).then(()=>{ if(el.isConnected&&list[i]===it) im.src=purl(t,it.id) }) } el.querySelector('#lbn').textContent=`${t.cover.title} · ${i+1} / ${list.length}`;
    el.querySelector('#lbc').innerHTML=(it.where?`<span class="where">${esc(it.where)}</span>`:'')+cap(it.cap); };
  const close=()=>{ el.remove(); document.body.style.overflow=''; document.removeEventListener('keydown',key); opener&&opener.focus&&opener.focus() };
  const key=e=>{ if(e.key==='Escape')close(); if(e.key==='ArrowRight')show(i+1); if(e.key==='ArrowLeft')show(i-1) };
  el.querySelector('#lbx').onclick=close; el.querySelector('#lbp').onclick=()=>show(i-1); el.querySelector('#lbnx').onclick=()=>show(i+1);
  el.querySelector('.stage').addEventListener('click',e=>{ if(e.target.classList.contains('stage')) close() });
  swipe(el.querySelector('.stage'),d=>show(i+d)); document.addEventListener('keydown',key); show(i); el.querySelector('#lbx').focus();
}

  app.innerHTML=`<div class="wrap people"><button class="back" style="background:var(--chip)" id="pb">← Our People</button>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="pfaces" style="width:150px">${base.reps.slice(0,3).map((_,k)=>`<img src="${faceURL(base,k)}" alt="">`).join('')}</div>
    <div><div class="eyebrow">${items.length} photos · ${new Set(items.map(f=>f[0])).size} trips</div><h1>${esc(nm||'Someone we haven\'t named yet')}</h1></div></div><div id="pbody" class="load">Loading photos…<div class="prog"><i id="pg"></i></div></div></div>`;
  $('#pb').onclick=()=>go('people');
  const keys=[...new Set(items.map(f=>f[0]))]; for(const k of keys){ const t=T[k]; const need=[...new Set(items.filter(f=>f[0]===k).map(f=>t.photos[f[1]][0]))]; await Promise.all(need.map(n=>loadPack(t.photoPacks[n]))); for(const n of need) packs[t.photoPacks[n]]=await packs[t.photoPacks[n]] }
  if(view.tab!=='person'||view.pid!==pid) return;
  const H=innerWidth<640?120:170;
  $('#pbody').outerHTML=keys.map(k=>{ const t=T[k]; const its=items.filter(f=>f[0]===k);
    return `<section class="sec" style="padding-block:16px 0"><div class="eyebrow">${esc(t.cover.dates||'')}</div><h2 style="font-size:26px">${esc(t.cover.title)}</h2>
      <div class="allph" style="padding-block:6px 0">${its.map(f=>{const a=aspect(t,f[1]); return `<button class="ph" data-pp="${k}:${f[1]}" style="flex:${a} 1 ${Math.round(a*H)}px;height:${H}px;max-width:100%" aria-label="Open photo"><img loading="lazy" src="${purl(t,f[1])}" alt=""></button>`}).join('')}</div></section>` }).join('');
  app.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.pp.split(':'); const t=T[k]; const list=items.filter(f=>f[0]===k).map(f=>({id:f[1],where:nm||''})); openLB(t,list,list.findIndex(x=>x.id==id)) });
}

/* search across every caption, chapter and story */
let SI=null;
function buildSearch(){ SI=[]; for(const t of IDX.trips) t.sections.forEach((s,si)=>{
  SI.push({t,si,kind:'chapter',title:s.title||s.eyebrow||'',text:[s.eyebrow,s.title,s.sub,s.intro].filter(Boolean).join(' '),photo:(s.groups||[]).flatMap(g=>g[0]||[])[0]});
  for(const g of (s.groups||[])) if(g[1]) SI.push({t,si,kind:'photo',title:capText(g[1]).split(' — ')[0]||s.title,text:capText(g[1]),photo:(g[0]||[])[0],where:s.title}); }); }
function search(q){
  if(!SI) buildSearch(); const words=q.toLowerCase().split(/\s+/).filter(Boolean); if(!words.length) return go('trips');
  const wordHit=(hay,w)=>w.length<=4?new RegExp('(^|[^a-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=[^a-z]|$)').test(hay):hay.includes(w); const hits=SI.filter(r=>words.every(w=>wordHit((r.text+' '+r.t.cover.title+' '+(r.t.folio||'')).toLowerCase(),w))).slice(0,120);
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'); const hl=s=>esc(s).replace(re,'<mark>$1</mark>');
  view={tab:'search'};
  const ppl=FACES?Object.values(FACES.people.reduce((m,p)=>{ const n=pName(p.id); if(n&&words.every(w=>n.toLowerCase().includes(w))){ (m[n.toLowerCase()]=m[n.toLowerCase()]||{n,ps:[]}).ps.push(p) } return m },{})):[];
  app.innerHTML=`<div class="wrap"><div class="results">${ppl.length?`<div class="eyebrow">People</div>${ppl.map(g=>`<button class="res" data-person="${g.ps[0].id}"><div class="t"><img src="${faceURL(g.ps[0],0)}" alt=""></div><div class="x"><b>${hl(g.n)}</b><span>${g.ps.reduce((s,p)=>s+p.n,0)} photos with this face</span></div></button>`).join('')}`:''}
   <div class="eyebrow">${hits.length} result${hits.length===1?'':'s'} for “${esc(q)}”</div>
   ${hits.map((r,k)=>`<button class="res" data-k="${k}"><div class="t" data-ph="${k}"></div><div class="x"><b>${hl(r.title)}</b><span>${esc(r.t.cover.title)} · ${esc(r.t.cover.dates||'')}${r.where?' · '+esc(r.where):''}</span><span>${hl(r.text.slice(0,220))}</span></div></button>`).join('')}
   ${hits.length?'':'<p>Try a place, a person, or a year.</p>'}</div></div>`;
  app.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>go('person-'+b.dataset.person));
  if(typeof treeSearch==='function') treeSearch(words).then(tp=>{ if(!tp.length||view.tab!=='search') return; const box=app.querySelector('.results'); if(!box) return;
    box.insertAdjacentHTML('afterbegin',`<div class="eyebrow">Family tree</div>`+tp.map(p=>`<button class="res" data-tree="${p.id}"><div class="t" style="display:grid;place-items:center;font-family:var(--display);font-size:24px">${esc(p.name[0])}</div><div class="x"><b>${hl(p.name)}</b><span>${esc([p.yrs,p.bp].filter(Boolean).join(' · '))}</span></div></button>`).join(''));
    box.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>go('tree-'+b.dataset.tree)) });
  if(typeof loadMovies==='function') loadMovies().then(mv=>{ if(view.tab!=='search') return; const fm=mv.films.filter(m=>words.every(w=>(m.title+' '+m.y0+' '+m.y1+' '+(m.chapters||[]).map(c=>c.title).join(' ')+' '+(m.cast||[]).map(c=>c.name).join(' ')).toLowerCase().includes(w))).slice(0,8); const box=app.querySelector('.results'); if(!fm.length||!box) return;
    box.insertAdjacentHTML('beforeend',`<div class="eyebrow">Home movies</div>`+fm.map(m=>`<button class="res" data-movie="${m.id}"><div class="t" style="display:grid;place-items:center;font-size:22px">🎞</div><div class="x"><b>${hl(m.title)}</b><span>${m.y0===m.y1?m.y0:m.y0+' – '+m.y1} · ${Math.round(m.dur/60)} min</span></div></button>`).join(''));
    box.querySelectorAll('[data-movie]').forEach(b=>b.onclick=()=>go('movie-'+b.dataset.movie)) }).catch(()=>{});
  app.querySelectorAll('.res[data-k]').forEach(b=>b.onclick=async()=>{ const r=hits[+b.dataset.k]; location.hash=r.t.key; await waitStory(); const s=document.getElementById('s'+r.t.sections.filter(s=>s.title||s.intro||(s.groups||[]).length).indexOf(r.t.sections[r.si])); s&&s.scrollIntoView() });
  hits.forEach(async(r,k)=>{ if(r.photo==null) return; const u=await coverOne(r.t,r.photo); const c=app.querySelector(`[data-ph="${k}"]`); if(c&&u) c.innerHTML=`<img src="${u}" alt="">` });
}
async function coverOne(t,id){ const ref=t.photos[id]; if(!ref) return ''; if(t.thumbPack){ await ensureThumbs(t); return turl(t,id) } await loadPack(t.photoPacks[ref[0]]); packs[t.photoPacks[ref[0]]]=await packs[t.photoPacks[ref[0]]]; return purl(t,id) }
function waitStory(){ return new Promise(r=>{ const iv=setInterval(()=>{ if(document.querySelector('.sec')){clearInterval(iv); r()} },120); setTimeout(()=>{clearInterval(iv); r()},20000) }) }
let qt; $('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),250) });

document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ $('#q').value=''; go(b.dataset.nav) });
{ const bar=document.querySelector('header.bar'); const setH=()=>document.documentElement.style.setProperty('--barh',bar.offsetHeight+'px'); new ResizeObserver(setH).observe(bar); setH() }
function markNav(h){ const sec=/^(globe)/.test(h)?'globe':/^(people|person)/.test(h)?'people':/^(tree|family|fan|circles|related)/.test(h)?'tree':/^books?(-|$)/.test(h)?'books':/^timeline/.test(h)?'timeline':/^movie/.test(h)?'movies':'trips'; document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===sec)) }
window.addEventListener('hashchange',()=>markNav(location.hash.slice(1)));

/* ---------- Keyboard shortcuts, Back and Escape ---------- */
function backOrHome(){ const h=location.hash.slice(1); if(!h||h==='trips') return; if(history.length>1&&document.referrer!==location.href) history.back(); else go('trips') }
function shortcuts(){ if(document.querySelector('.kbd')){ document.querySelector('.kbd').remove(); return }
  const el=document.createElement('div'); el.className='kbd'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Keyboard shortcuts');
  el.innerHTML=`<div><h2>Keyboard shortcuts</h2><p style="margin:0;color:var(--muted);font-size:13.5px">Press <kbd>?</kbd> any time to show or hide this list.</p>
   <h3>Everywhere</h3><dl><dt><kbd>Esc</kbd></dt><dd>Close what's open, or go back one step</dd><dt><kbd>Alt</kbd> <kbd>←</kbd></dt><dd>Back · also the ← button in the top bar</dd>
   <dt><kbd>/</kbd></dt><dd>Search places, people and captions</dd><dt><kbd>1</kbd> … <kbd>6</kbd></dt><dd>Trips · Globe · People · Family Tree · Timeline · Movies</dd><dt><kbd>D</kbd></dt><dd>Switch light or dark</dd></dl>
   <h3>Photos and books</h3><dl><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Previous or next photo or page</dd><dt><kbd>Esc</kbd></dt><dd>Close the photo viewer</dd></dl>
   <h3>Globe</h3><dl><dt>Drag · scroll · pinch</dt><dd>Turn, and zoom toward the cursor</dd><dt>Double-click</dt><dd>Zoom in there</dd><dt><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd></dt><dd>Turn the globe</dd><dt><kbd>+</kbd> <kbd>−</kbd></dt><dd>Zoom</dd><dt><kbd>Space</kbd></dt><dd>Pause or play rotation</dd></dl>
   <h3>Family Tree</h3><dl><dt><kbd>↑</kbd> · <kbd>Shift</kbd> <kbd>↑</kbd></dt><dd>Go to father · mother</dd><dt><kbd>↓</kbd></dt><dd>Go to first child</dd><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Brothers and sisters</dd><dt><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></dt><dd>Zoom · fit to screen</dd><dt><kbd>H</kbd> · <kbd>F</kbd></dt><dd>Whole family · find a person</dd></dl>
   <p style="margin:16px 0 0"><button class="readvol" id="kbx">Close</button></p></div>`;
  const opener=document.activeElement; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Keyboard shortcuts'); document.body.appendChild(el); const bye=()=>{ el.remove(); opener&&opener.focus&&opener.focus() }; el.onclick=e=>{ if(e.target===el) bye() }; el.querySelector('#kbx').onclick=bye; el.addEventListener('keydown',e=>{ if(e.key!=='Tab') return; const f=[...el.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')]; if(!f.length) return; const a=f[0], z=f[f.length-1]; if(e.shiftKey&&document.activeElement===a){ z.focus(); e.preventDefault() } else if(!e.shiftKey&&document.activeElement===z){ a.focus(); e.preventDefault() } }); el.querySelector('#kbx').focus() }
document.addEventListener('keydown',e=>{
  const typing=e.target&&e.target.matches&&e.target.matches('input,textarea,[contenteditable]');
  if(e.key==='Escape'){
    if(document.querySelector('.kbd')){ document.querySelector('.kbd').remove(); return }
    if(document.querySelector('.lb')) return; // the photo viewer closes itself
    if(typing){ if(e.target.id==='q'&&e.target.value){ e.target.value=''; go('trips') } e.target.blur(); return }
    const gc=document.getElementById('gcard'); if(gc&&!gc.hidden){ gc.querySelector('.gx')?.click(); return }
    const gr=document.getElementById('gres')||document.getElementById('ftr'); if(gr&&!gr.hidden){ gr.hidden=true; return }
    if(view.tab==='tree'&&typeof treeBack==='function'&&treeBack()) return;
    return backOrHome() }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(document.querySelector('.lb')||document.querySelector('.kbd')) { if(e.key==='?'){ shortcuts() } return }
  if(view.tab==='tree'){ const r=document.querySelector('.ft'); if(r&&r._key&&r._key(e)){ e.preventDefault(); return } }
  if(view.tab==='timeline'){ const r=document.querySelector('.tlx'); if(r&&r._key&&r._key(e)){ e.preventDefault(); return } }
  if(view.tab==='globe'&&e.key===' '){ e.preventDefault(); document.getElementById('gspin')?.click(); return }
  if(view.tab==='globe'&&/^Arrow|^[+=-]$/.test(e.key)){ const c=document.getElementById('gc'); if(c&&document.activeElement!==c){ c.focus(); c.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,bubbles:false})); e.preventDefault() } return }
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return }
  if(e.key==='?'){ shortcuts(); return }
  if(e.key==='d'||e.key==='D'){ $('#theme').click(); return }
  const nav={'1':'trips','2':'globe','3':'people','4':'tree','5':'timeline','6':'movies'}[e.key]; if(nav){ $('#q').value=''; go(nav) }
});
$('#navback').onclick=backOrHome; $('#kbbtn').onclick=shortcuts;
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); $('#navback').hidden=!h||h==='trips' }); $('#navback').hidden=!location.hash.slice(1)||location.hash==='#trips';

function route(){ document.querySelectorAll('.lb,.kbd,.glb').forEach(e=>e.remove()); document.body.style.overflow=''; if(!IDX) return; const h=location.hash.slice(1); markNav(h); if(!h||h==='trips'){ view={}; return home() }
  const vm=h.match(/^vol([123])$/); if(vm) return volume(+vm[1]-1);
  if(h==='globe') return globe(); const gm=h.match(/^globe-([a-z0-9]+)$/); if(gm) return globe(gm[1]);
  if(h==='timeline'||h==='timeline-lines'||h==='timeline-machine') return typeof familyTimeline==='function'?familyTimeline(app,h.endsWith('lines')?'lines':'machine'):home();
  if(h==='movies') return typeof homeMovies==='function'?homeMovies(app):home(); const mvm=h.match(/^movie-([\w-]+)$/); if(mvm) return typeof homeMovie==='function'?homeMovie(app,mvm[1]):home();
  { const fm=h.match(/^(family|fan|circles|related)(?:-([A-Za-z0-9]+))?$/); if(fm){ view={tab:'family'}; return typeof familyViews==='function'?familyViews(app,{family:'focus',fan:'fan',circles:'circ',related:'path'}[fm[1]],fm[2]||null):home() } }
  if(h==='tree'||/^tree-[A-Za-z0-9]+$/.test(h)){ view={tab:'tree'}; if(typeof familyTree!=='function') return home(); const fid=h.startsWith('tree-')?h.slice(5):null; return Promise.resolve(familyTree(app,fid)).then(()=>{ typeof fvTabs==='function'&&fvTabs(app,fid) }) }
  if(h==='books') return typeof dadBooks==='function'?dadBooks(app):home(); const bm=h.match(/^book-([a-z0-9]+)(?:-(\d+))?$/); if(bm) return typeof dadBook==='function'?dadBook(app,bm[1],bm[2]):home();
  if(h==='people') return people(); const pm=h.match(/^person-(p\d+)$/); if(pm) return person(pm[1]);
  const m=h.match(/^([a-z0-9]+)(?:-(photos|book))?$/); const t=m&&T[m[1]]; if(t) return trip(t,m[2]||'story'); home() }

(async()=>{ app.innerHTML='<div class="wrap load">Opening the family albums…</div>'; if(document.readyState==='loading') await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  try{ IDX=await (await fetch('index.json')).json(); IDX.trips.forEach(t=>T[t.key]=t); route() }
  catch(e){ app.innerHTML=`<div class="wrap load">The albums didn't load (${esc(e.message)}). Reload the page to try again.</div>` } })();
</script>
